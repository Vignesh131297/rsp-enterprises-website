<!--
  EmailJS template for website enquiries (paste into EmailJS > Email Templates > Content > Edit Content > Code).
  Template settings:
    Subject:   {{subject}}
    To Email:  pm@rspenterprises.net
    Bcc:       rspenterprises2013@gmail.com
    From Name: RSP Website
    Reply To:  {{customer_email}}
  {{message}} is the same plain text the visitor can send on WhatsApp, for example:
    Hi RSP, I have an enquiry from your website.
    Name: Ramesh Kumar
    Company: ABC Builders
    Phone / WhatsApp: 98450 12345
    Email: ramesh@abcbuilders.com
    Service needed: Excavation & rock breaking
    Site location: Whitefield, Bangalore
    Project details: 2-level basement, approx. 8,000 sq ft plot
-->
<div style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.6; color: #1c1b19; white-space: pre-line">{{message}}</div>
